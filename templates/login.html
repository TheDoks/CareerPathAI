<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPath AI | Login</title>
    <script src="/static/js/tailwind.js"></script>
    <script src="/static/js/chart.min.js"></script>
    <link href="/static/css/fontawesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1e293b inset !important; -webkit-text-fill-color: #e2e8f0 !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background glows -->
    <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md px-6 z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 items-center justify-center shadow-lg shadow-blue-500/30 mb-4">
                <i class="fas fa-brain text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">CareerPath<span class="text-blue-400">AI</span></h1>
            <p class="text-slate-400 text-sm mt-1">Enterprise Login Portal</p>
        </div>

        <!-- Card -->
        <div class="glass-panel rounded-2xl p-8">
            <h2 class="text-lg font-semibold text-white mb-6">Sign in to your account</h2>

            <div id="errorMsg" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-2">
                <i class="fas fa-circle-exclamation"></i>
                <span id="errorText">Incorrect username or password</span>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input id="username" type="text" placeholder="Enter your username"
                            class="w-full bg-slate-800/60 border border-slate-600 rounded-xl pl-10 pr-4 py-3 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition"
                            onkeydown="if(event.key==='Enter') doLogin()">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                        <input id="password" type="password" placeholder="Enter your password"
                            class="w-full bg-slate-800/60 border border-slate-600 rounded-xl pl-10 pr-12 py-3 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition"
                            onkeydown="if(event.key==='Enter') doLogin()">
                        <button onclick="togglePwd()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition">
                            <i id="eyeIcon" class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button onclick="doLogin()" id="loginBtn"
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/20 transition-all transform hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2 mt-2">
                    <i class="fas fa-right-to-bracket"></i>
                    <span id="btnText">Sign In</span>
                </button>
            </div>

            <p class="text-center text-slate-600 text-xs mt-6">CareerPath AI &mdash; Federal Polytechnic Offa &bull; AI Department &bull; HND Final Year Project</p>
        </div>
    </div>

    <script>
        function togglePwd() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'fas fa-eye-slash text-sm';
            } else {
                inp.type = 'password';
                icon.className = 'fas fa-eye text-sm';
            }
        }

        async function doLogin() {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('errorMsg');
            const errText = document.getElementById('errorText');

            if (!username || !password) {
                errText.textContent = 'Please enter both username and password.';
                errDiv.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            btn.querySelector('i').className = 'fas fa-circle-notch fa-spin';
            errDiv.classList.add('hidden');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errText.textContent = data.message || 'Incorrect username or password';
                    errDiv.classList.remove('hidden');
                }
            } catch {
                errText.textContent = 'Connection error. Please try again.';
                errDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                btn.querySelector('i').className = 'fas fa-right-to-bracket';
            }
        }
    </script>
</body>
</html>
